name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No requirements.txt exists in this repo (only stdlib + reportlab/requests
      # are imported, with nothing pinned). This step only catches syntax errors
      # via py_compile - it does not execute the scripts or resolve imports, so
      # it needs no installs. See project notes for the honest v1 scope.
      - name: Compile-check all Python files
        run: python -m compileall . -q

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      # tests/ never writes into the checkout: listing_lock and rebuild_final.py
      # run in pytest's tmp_path copies (see tests/conftest.py). Includes one full
      # build on the repository's own listings/, i.e. what the PostToolUse hook
      # and run_pipeline.py's "сборка сайта" step do.
      - name: Run pytest
        env:
          PYTHONUTF8: "1"
        run: python -m pytest
